name: phase6a2-full-horizon

on:
  pull_request:
    branches: [phase6a1-integrity-remediation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-horizon-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Install exact numerical environment
        run: |
          python -m pip install --only-binary=:all: \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'pytest==9.1.1' \
            'numpy==2.5.1' \
            'scipy==1.18.0'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Record triggering source identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          sha256sum pyproject.toml protocol/phase6_runner_v1/INTEGRITY_BASELINE.json
      - name: Verify blocked execution state
        run: |
          test ! -e protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json
          test ! -d artifacts/phase6_pilot
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run full-horizon smoke numerical gate
        env:
          ARG_RUN_FULL_HORIZON: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m pytest -q \
            tests/test_phase6a2_hardening.py::test_full_horizon_smoke_primary_models_pass_numerical_gates
