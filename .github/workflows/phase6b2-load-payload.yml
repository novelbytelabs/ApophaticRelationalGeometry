name: phase6b2-load-payload

on:
  pull_request:
    branches: [phase6b2-loader-trigger]

permissions:
  contents: write

concurrency:
  group: phase6b2-load-payload
  cancel-in-progress: false

jobs:
  load-reviewed-payload:
    if: github.event.pull_request.head.ref == 'phase6b2-h6-conditioning'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout loader payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase6b2-loader-trigger
          path: loader
          persist-credentials: false
      - name: Verify and reconstruct reviewed payload
        run: |
          set -euo pipefail
          cd loader
          echo '426339f44f1fabda01f964fbc5c3c0d3f9235cb7eef261ea9e0b7c1d5ebf00aa  bootstrap/phase6b2_payload_00.b64' | sha256sum -c -
          echo '18a827e685820517b975e64037e3d11f2338e2c2c2803c5238ee304115f91e38  bootstrap/phase6b2_payload_01.b64' | sha256sum -c -
          echo '18f11f10cbfc78e87d1e0a801e4be9644d3c76b894b4d83184fc46739b2c8244  bootstrap/phase6b2_payload_02.b64' | sha256sum -c -
          echo 'ffeb9bf365a91682713e0ceb41e188928a28782ff2c80ea6f69f56125d113ad7  bootstrap/phase6b2_payload_03.b64' | sha256sum -c -
          echo '2489f6cf7847a34c85eeaec4f5eb7cdebbfb20a537a06caf81488583b9506a60  bootstrap/phase6b2_payload_04.b64' | sha256sum -c -
          cat bootstrap/phase6b2_payload_*.b64 > /tmp/phase6b2-payload.b64
          echo '27f5c536521ea4f4fb5e9f7646bcdccde5b2be0857bf34c0aa07372a25687cd2  /tmp/phase6b2-payload.b64' | sha256sum -c -
          base64 --decode /tmp/phase6b2-payload.b64 > /tmp/phase6b2-payload.tar.gz
          echo '77882759096df8e54ba722c0a025c424091ea6831b755222726635c570d26df2  /tmp/phase6b2-payload.tar.gz' | sha256sum -c -
          tar -tzf /tmp/phase6b2-payload.tar.gz | tee /tmp/phase6b2-payload-files.txt
          test "$(wc -l < /tmp/phase6b2-payload-files.txt)" = '21'
          test -z "$(grep -E '(^|/)EXECUTION_AUTHORIZATION\.json$|(^|/)artifacts/' /tmp/phase6b2-payload-files.txt || true)"
      - name: Checkout exact remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase6b2-h6-conditioning
          path: work
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Materialize and validate payload
        run: |
          set -euo pipefail
          cd work
          test "$(git rev-parse HEAD)" = '92884777c1e9f10f7c2732f4d86e9ac966ca51ad'
          test -z "$(git status --porcelain --untracked-files=all)"
          tar -xzf /tmp/phase6b2-payload.tar.gz
          test ! -e protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json
          test ! -d artifacts/phase6_pilot
          python -m pip install --only-binary=:all: \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'pytest==9.1.1' \
            'numpy==2.5.1' \
            'scipy==1.18.0'
          python -m pip install --no-build-isolation --no-deps -e .
          python -m py_compile \
            src/apophatic_geometry/pilot_gates.py \
            src/apophatic_geometry/pilot_manifest.py \
            src/apophatic_geometry/pilot.py \
            tools/h6_conditioning_diagnostic.py \
            tests/test_phase6b2_h6_conditioning.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONHASHSEED=0 \
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
            python -m pytest -q \
              tests/test_phase6b2_h6_conditioning.py \
              tests/test_phase6_numerics.py
      - name: Commit exact validated payload
        run: |
          set -euo pipefail
          cd work
          git config user.name 'ARG Integrity Loader'
          git config user.email 'arg-integrity-loader@users.noreply.github.com'
          git add --all
          test "$(git diff --cached --name-only | wc -l)" = '21'
          git commit -m 'Remediate ill-conditioned H6 identity gate'
          git push origin HEAD:phase6b2-h6-conditioning
