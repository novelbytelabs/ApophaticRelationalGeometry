name: phase6a2-audit-pr

on:
  pull_request:
    branches: [phase6a2-audit-bundle]

permissions:
  contents: read

jobs:
  build-pinned-auditor-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17a17398808cae1befe85e795d371012fe999f03
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Install exact verification environment
        run: |
          python -m pip install --only-binary=:all: \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'pytest==9.1.1' \
            'numpy==2.5.1' \
            'scipy==1.18.0'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify pinned blocked candidate
        run: |
          test "$(git rev-parse HEAD)" = "17a17398808cae1befe85e795d371012fe999f03"
          test ! -e protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json
          test ! -d artifacts/phase6_pilot
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run ordinary suite and hardened tripwire
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -o pipefail
          rm -rf /tmp/arg_phase6a2_evidence
          mkdir -p /tmp/arg_phase6a2_evidence
          python -m pytest -q 2>&1 | tee /tmp/arg_phase6a2_evidence/pytest.txt
          python tools/arg_tripwire.py 2>&1 | tee /tmp/arg_phase6a2_evidence/tripwire.json
      - name: Run full-horizon gate
        env:
          ARG_RUN_FULL_HORIZON: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_phase6a2_hardening.py::test_full_horizon_smoke_primary_models_pass_numerical_gates \
            2>&1 | tee /tmp/arg_phase6a2_evidence/full_horizon.txt
      - name: Build packet
        env:
          CANDIDATE_COMMIT: 17a17398808cae1befe85e795d371012fe999f03
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python -VV > /tmp/arg_phase6a2_evidence/python.txt 2>&1
          python -m pip freeze --all > /tmp/arg_phase6a2_evidence/pip_freeze.txt
          uname -a > /tmp/arg_phase6a2_evidence/uname.txt
          git rev-parse HEAD > /tmp/arg_phase6a2_evidence/commit.txt
          git rev-parse HEAD^{tree} > /tmp/arg_phase6a2_evidence/tree.txt
          git status --porcelain --untracked-files=all > /tmp/arg_phase6a2_evidence/git_status.txt
          git ls-files -s > /tmp/arg_phase6a2_evidence/git_index.txt
          git archive --format=zip --prefix=repository/ "$CANDIDATE_COMMIT" -o /tmp/arg_repository.zip
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import zipfile

          candidate = os.environ['CANDIDATE_COMMIT']
          evidence = Path('/tmp/arg_phase6a2_evidence')
          tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          summary = {
              'format': 'ARG-PHASE6A2-REAUDIT-v1',
              'candidate_commit': candidate,
              'candidate_tree': tree,
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'ordinary_suite': 'PASS',
              'hardened_tripwire': 'PASS',
              'full_horizon_smoke': 'PASS',
              'execution_authorization_present': False,
              'pilot_artifacts_present': False,
              'scientific_result_present': False,
              'claim_ceiling': 'trustworthy computational runner prototype; scientific conclusion not established',
          }
          scope = (
              '# ARG Phase 6A.2 Re-audit Packet\n\n'
              f'Candidate commit: `{candidate}`\n\n'
              f'Candidate tree: `{tree}`\n\n'
              'This packet covers runner integrity and numerical verification. '
              'It contains no execution authorization, pilot trajectories, or '
              'scientific conclusion. Pilot execution remains blocked.\n'
          ).encode('utf-8')
          summary_bytes = (
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          ).encode('utf-8')

          entries = []
          with zipfile.ZipFile('/tmp/arg_repository.zip', 'r') as source:
              for info in sorted(source.infolist(), key=lambda item: item.filename):
                  if info.is_dir():
                      continue
                  entries.append((info.filename, source.read(info.filename), 0o644))
          for path in sorted(evidence.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f'unsupported evidence entry: {path}')
              entries.append((f'evidence/{path.name}', path.read_bytes(), 0o644))
          entries.append(('AUDIT_SCOPE.md', scope, 0o644))
          entries.append(('AUDIT_SUMMARY.json', summary_bytes, 0o644))

          manifest_entries = {
              name: {
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'bytes': len(content),
              }
              for name, content, _mode in entries
          }
          manifest = {
              'format': 'ARG-PHASE6A2-REAUDIT-MANIFEST-v1',
              'candidate_commit': candidate,
              'candidate_tree': tree,
              'entry_count_excluding_manifest': len(entries),
              'entries': manifest_entries,
          }
          manifest_bytes = (
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          ).encode('utf-8')
          entries.append(('AUDIT_MANIFEST.json', manifest_bytes, 0o644))

          output = Path('/tmp/ARG_Phase6A2_Reaudit_17a1739.zip')
          fixed_time = (1980, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(
              output,
              'w',
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for name, content, mode in sorted(entries):
                  info = zipfile.ZipInfo(name, fixed_time)
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, content, compresslevel=9)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('/tmp/ARG_Phase6A2_Reaudit_17a1739.zip.sha256').write_text(
              f'{digest}  {output.name}\n', encoding='ascii'
          )
          print(json.dumps({'packet_sha256': digest, 'entries': len(entries)}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ARG-Phase6A2-Reaudit-17a1739
          path: |
            /tmp/ARG_Phase6A2_Reaudit_17a1739.zip
            /tmp/ARG_Phase6A2_Reaudit_17a1739.zip.sha256
          if-no-files-found: error
          retention-days: 30
