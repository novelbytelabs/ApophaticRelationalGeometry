name: phase6b1-execute-pilot

on:
  pull_request:
    branches: [phase6b1-execution-trigger]

permissions:
  contents: read

concurrency:
  group: arg-phase6b1-pilot-20260802t192116z
  cancel-in-progress: false

jobs:
  execute-development-pilot:
    if: github.event.pull_request.head.sha == 'e8c5467cd0a3ddd35c07489c55b4fa6dfa987388'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AUTHORIZED_COMMIT: e8c5467cd0a3ddd35c07489c55b4fa6dfa987388
      RUNNER_COMMIT: 92884777c1e9f10f7c2732f4d86e9ac966ca51ad
      EXECUTION_ID: arg-p6b1-pilot-20260802t192116z
      ARCHIVE_ROOT: /home/runner/work/ApophaticRelationalGeometry/ApophaticRelationalGeometry/artifacts/phase6_pilot/arg-p6b1-pilot-20260802t192116z
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e8c5467cd0a3ddd35c07489c55b4fa6dfa987388
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install exact execution environment
        run: |
          python -m pip install --only-binary=:all: \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'numpy==2.5.1' \
            'scipy==1.18.0'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify authorization-only source identity
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = '/home/runner/work/ApophaticRelationalGeometry/ApophaticRelationalGeometry'
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_COMMIT"
          test "$(git rev-parse HEAD^)" = "$RUNNER_COMMIT"
          test "$(git rev-list --count "$RUNNER_COMMIT..$AUTHORIZED_COMMIT")" = '1'
          test "$(git diff --name-only "$RUNNER_COMMIT" "$AUTHORIZED_COMMIT")" = 'protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json'
          test "$(git rev-parse "$RUNNER_COMMIT^{tree}")" = '9ff51165d15d114a3527d9a97af4b9c1abfacfac'
          test ! -e "$ARCHIVE_ROOT"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "authorized_commit=$(git rev-parse HEAD)"
            echo "authorization_tree=$(git rev-parse HEAD^{tree})"
            echo "runner_commit=$RUNNER_COMMIT"
            echo "runner_tree=$(git rev-parse "$RUNNER_COMMIT^{tree}")"
            echo "workspace=$GITHUB_WORKSPACE"
            python --version
            python - <<'PY'
          import numpy, scipy
          print('numpy=' + numpy.__version__)
          print('scipy=' + scipy.__version__)
          PY
            sha256sum protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json
          } | tee /tmp/phase6b1-source-identity.txt
      - name: Verify data-free frozen plan
        run: |
          python -m apophatic_geometry.pilot_cli plan --repo-root . | tee /tmp/phase6b1-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/phase6b1-plan.json').read_text('utf-8'))
          assert plan['configuration_count'] == 50
          assert plan['direction_count'] == 10
          assert plan['confirmatory_execution'] == 'BLOCKED'
          assert plan['pilot_executed'] is False
          PY
      - name: Execute exact frozen development pilot
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/phase6b1-execution.log
          timeout --signal=TERM --kill-after=60s 342m \
            python -m apophatic_geometry.pilot_cli execute \
              --repo-root "$GITHUB_WORKSPACE" \
              --archive "$ARCHIVE_ROOT" \
            > /tmp/phase6b1-execution.log 2>&1 &
          pilot_pid=$!
          while kill -0 "$pilot_pid" 2>/dev/null; do
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] pilot execution active"
            tail -n 5 /tmp/phase6b1-execution.log || true
            sleep 300
          done
          wait "$pilot_pid"
          status=$?
          cat /tmp/phase6b1-execution.log
          exit "$status"
      - name: Independently verify completed archive
        if: success()
        run: |
          python - <<'PY' | tee /tmp/phase6b1-verification.json
          import json
          from apophatic_geometry.pilot_manifest import load_frozen_bundle
          from apophatic_geometry.pilot_verify import verify_pilot_archive
          root = '/home/runner/work/ApophaticRelationalGeometry/ApophaticRelationalGeometry'
          archive = root + '/artifacts/phase6_pilot/arg-p6b1-pilot-20260802t192116z'
          result = verify_pilot_archive(archive, load_frozen_bundle(root))
          print(json.dumps(result, sort_keys=True, indent=2, allow_nan=False))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/phase6b1-verification.json').read_text('utf-8'))
          assert result['status'] == 'VERIFIED_COMPLETE'
          assert result['configuration_records'] == 50
          assert result['trajectory_records'] == 1450
          assert result['summary_records'] == 50
          assert result['source_commit'] == 'e8c5467cd0a3ddd35c07489c55b4fa6dfa987388'
          PY
      - name: Package immutable execution evidence
        if: always()
        run: |
          set -euo pipefail
          handoff=/tmp/phase6b1-handoff
          mkdir -p "$handoff"
          cp /tmp/phase6b1-source-identity.txt "$handoff/" || true
          cp /tmp/phase6b1-plan.json "$handoff/" || true
          cp /tmp/phase6b1-execution.log "$handoff/" || true
          cp /tmp/phase6b1-verification.json "$handoff/" || true
          if [ -d "$ARCHIVE_ROOT" ]; then
            if [ -f "$ARCHIVE_ROOT/ARCHIVE_COMPLETE.json" ]; then
              echo COMPLETE > "$handoff/archive_status.txt"
            else
              echo PARTIAL_OR_FAILED > "$handoff/archive_status.txt"
            fi
            tar -C "$(dirname "$ARCHIVE_ROOT")" -czf "$handoff/${EXECUTION_ID}.tar.gz" "$(basename "$ARCHIVE_ROOT")"
            sha256sum "$handoff/${EXECUTION_ID}.tar.gz" > "$handoff/${EXECUTION_ID}.tar.gz.sha256"
            du -sh "$ARCHIVE_ROOT" | tee "$handoff/archive_size.txt"
          else
            echo NO_ARCHIVE_CREATED > "$handoff/archive_status.txt"
          fi
          find "$handoff" -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Upload pilot execution handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arg-phase6b1-pilot-execution
          path: /tmp/phase6b1-handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
