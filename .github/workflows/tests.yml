name: tests

on:
  push:
    branches: [main, phase2-m0, phase6a1-integrity-remediation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10.20"
            numpy-version: "2.2.6"
            scipy-version: "1.15.3"
          - python-version: "3.12.13"
            numpy-version: "2.5.1"
            scipy-version: "1.18.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact compatibility environment
        run: |
          python -m pip install \
            'setuptools==80.9.0' \
            'wheel==0.45.1' \
            'pytest==9.1.1' \
            'numpy==${{ matrix.numpy-version }}' \
            'scipy==${{ matrix.scipy-version }}'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Record integrity fingerprints
        run: |
          python --version
          python - <<'PY'
          import numpy, scipy, pytest
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('pytest', pytest.__version__)
          PY
          sha256sum \
            src/apophatic_geometry/model.py \
            src/apophatic_geometry/models.py \
            src/apophatic_geometry/protocol.py \
            src/apophatic_geometry/attestation.py \
            src/apophatic_geometry/pilot_types.py \
            src/apophatic_geometry/pilot_manifest.py \
            src/apophatic_geometry/pilot_mechanisms.py \
            src/apophatic_geometry/pilot_integrators.py \
            src/apophatic_geometry/pilot_gates.py \
            src/apophatic_geometry/pilot_integrate.py \
            src/apophatic_geometry/pilot_archive.py \
            src/apophatic_geometry/pilot.py \
            src/apophatic_geometry/pilot_cli.py \
            protocol/phase5_v1/LOCK.json \
            protocol/phase6_runner_v1/EXECUTION_ENVIRONMENT.json \
            tests/reference_equations.py \
            tests/reference_pilot.py \
            tests/test_phase5_protocol.py \
            tests/test_phase6_numerics.py \
            tests/test_phase6_planning.py \
            tests/test_phase6a1_integrity.py
      - name: Assert no execution authorization or pilot data
        run: |
          test ! -e protocol/phase6_runner_v1/EXECUTION_AUTHORIZATION.json
          test ! -d artifacts/phase6_pilot
      - name: Test
        run: python -m pytest
