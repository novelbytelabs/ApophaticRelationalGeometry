[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apophatic-relational-geometry"
version = "0.2.0"
description = "Reference implementation of ARG collective-feedback and local/adaptive prototypes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Arqon Tech Research"}]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
arg-simulate = "apophatic_geometry.simulate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
