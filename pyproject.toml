[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apophatic-relational-geometry"
version = "0.6.0"
description = "ARG four-model prototypes with a frozen protocol and fail-closed pilot-only runner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Arqon Tech Research"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
arg-simulate = "apophatic_geometry.simulate:main"
arg-pilot = "apophatic_geometry.pilot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
